[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/nwb_benchmarks"]



[project]
name = "nwb_benchmarks"
version="0.1.2"
authors = [
  { name="Cody Baker", email="cody.baker@catalystneuro.com" },
]
description = "Benchmarking for NWB."
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "asv==0.6.6",
    "asv-runner==0.3.1",
    "numba>=0.58.1",  # Pin to specific version for cuda import
    "psutil",
    "dandi",
    "s3fs",
    "fsspec",
    "aiohttp",
    "remfile",
    "pyshark",
    "lindi>=0.3.6",
    "pynwb>=2.8.2",
    "hdmf>=3.14.5",
    "hdmf-zarr",
    "friendlywords",
    "typing_extensions",  # TODO: remove when dropping support for Python 3.10
]
license = {file = "license.txt"}
keywords = ["nwb", "benchmark"]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: BSD License",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: Unix",
]

[project.scripts]
nwb_benchmarks = "nwb_benchmarks.command_line_interface:main"

[dependency-groups]
database = ["polars"]
dev = ["ipython", "pre-commit"]
figures = ["seaborn", "matplotlib", "pyarrow"]
all = [
    {include-group = "database"},
    {include-group = "dev"},
    {include-group = "figures"}
]



[tool.black]
line-length = 120
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  \.toml
  |\.yml
  |\.txt
  |\.sh
  |\.git
  |\.ini
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
reverse_relative = true
known_first_party = ["nwb_benchmarks"]
