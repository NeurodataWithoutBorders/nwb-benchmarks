name: Dev tests
on:
  workflow_call:

env:
  TSHARK_PATH: ""
  NWB_BENCHMARKS_NETWORK_INTERFACE: ""

jobs:

  run:
    # Will read on PR dashboard as 'Deploy / DevTests / ubuntu'
    # Action dashboard identified by 'Dev tests'
    # Requirement settings identified as 'DevTests / ubuntu'
    name: ubuntu
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Clone repository
        run: |
          git clone https://github.com/neurodatawithoutborders/nwb_benchmarks.git
          cd nwb_benchmarks
          BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          git checkout $BRANCH

      - name: Install conda
        uses: conda-incubator/setup-miniconda@v2
        with:
          activate-environment: nwb_benchmarks
          auto-activate-base: false

      - name: Get the ISO week for the environment cache key
        id: week
        run: echo "week=$(date -u '+%G-W%V')" >> "$GITHUB_OUTPUT"

      # Reuse the environment built by an earlier run with the same dependency files. The pip dependencies are
      # unpinned, so the key also includes the ISO week to pick up new upstream releases at least weekly.
      - name: Restore cached conda environment
        id: env-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CONDA }}/envs/nwb_benchmarks
          key: conda-env-${{ runner.os }}-${{ runner.arch }}-${{ steps.week.outputs.week }}-${{ hashFiles('nwb_benchmarks/environments/nwb_benchmarks.yaml', 'nwb_benchmarks/pyproject.toml') }}

      - name: Install special conda environment
        if: steps.env-cache.outputs.cache-hit != 'true'
        run: conda env update --name nwb_benchmarks --file nwb_benchmarks/environments/nwb_benchmarks.yaml

      - name: Display installed packages and their sources for debugging
        run: |
          conda info
          conda list

      # These runs are a smoke test of the benchmark machinery, not a measurement, so each one is restricted to a
      # single parameter set. ASV matches the `--bench` pattern against `module.Class.method({parameters})`, which
      # lets the pattern pick one parametrization. Every parameter set opens the full remote NWB file in `setup`,
      # and the ophys file is by far the fastest of the three test files to open.
      - name: Run basic file read test
        working-directory: nwb_benchmarks
        run: |
          nwb_benchmarks run --bench "time_remote_file_reading.HDF5PyNWBRemfilePreloadedNoCacheFileReadBenchmark.time_read_hdf5_pynwb_remfile_preloaded_no_cache\(\{'name': 'OphysTestCase'" --debug
      - name: Run basic slicing test
        working-directory: nwb_benchmarks
        run: |
          nwb_benchmarks run --bench "time_remote_slicing.HDF5PyNWBRemfilePreloadedNoCacheContinuousSliceBenchmark.time_slice\(\{'name': 'OphysTestCase1'" --debug
